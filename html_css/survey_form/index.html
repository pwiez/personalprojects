<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Survey Form</title>
</head>
<body>
    <main>
        <h1>🧁 Cupcake Satisfaction Survey 🧁</h1>
        <p id="description"><em>Thanks for eating in our store earlier. We'd like your opinion on our cupcakes!</em></p>
    </main>
    <section id="form">
        <form id="survey-form">
            <fieldset id="personal-details">
                <legend>Personal details</legend>
                <label for="name-label">Name:
                    <input id="name-label" type="text" placeholder="Enter your name..." required></input>
                </label>
                <label for="age-label">Age:
                    <input id="age-label" type="number" min="13" max="120" required></input>
                </label>
                <label for="email-label">E-mail:
                    <input id="email-label" type="email" placeholder="Enter your e-mail..." required></input>
                </label>
            </fieldset>
            <fieldset id="cupcake-rating">
                <legend>Give your opinion on our cupcakes!</legend>
                <label for="number-label">Rate our cupcakes overall from 1 to 10 (optional):
                    <input id="number-label" type="number" min="1" max="10"></input>
                </label>
                <label for="dropdown">What's your favorite cupcake flavor?
                    <select id="dropdown">
                        <option value="" hidden>Choose...</option>
                        <option value="vanilla">Vanilla</option>
                        <option value="chocolate">Chocolate</option>
                        <option value="strawberry">Strawberry</option>
                        <option value="redvelvet">Red Velvet</option>
                    </select>
                </label>
                <div class="form-group">
                    <p>What type of frosting do you enjoy the most?</p>
                    <div class="option">
                        <input type="radio" id="frosting-buttercream" name="frosting" value="buttercream">
                        <label for="frosting-buttercream">Buttercream</label>
                    </div>
                    <div class="option">
                        <input type="radio" id="frosting-creamcheese" name="frosting" value="creamcheese">
                        <label for="frosting-creamcheese">Cream Cheese</label>
                    </div>
                    <div class="option">
                        <input type="radio" id="frosting-whippedcream" name="frosting" value="whippedcream">
                        <label for="frosting-whippedcream">Whipped Cream</label>
                    </div>
                    <div class="option">
                        <input type="radio" id="frosting-ganache" name="frosting" value="ganache">
                        <label for="frosting-ganache">Ganache</label>
                    </div>
                </div>
                <div class="form-group">
                    <p>Choose all the toppings that you enjoy:</p>
                    <div class="option">
                        <input type="checkbox" id="topping-sprinkles" name="topping" value="sprinkles">
                        <label for="topping-sprinkles">Sprinkles</label>
                    </div>
                    <div class="option">
                        <input type="checkbox" id="topping-nuts" name="topping" value="nuts">
                        <label for="topping-nuts">Nuts</label>
                    </div>
                    <div class="option">
                        <input type="checkbox" id="topping-fruit" name="topping" value="fruit">
                        <label for="topping-fruit">Fruit</label>
                    </div>
                    <div class="option">
                        <input type="checkbox" id="topping-chocolatechips" name="topping" value="chocolatechips">
                        <label for="topping-chocolatechips">Chocolate Chips</label>
                    </div>
                </div>
                <label for="textarea">
                    Our company would like to know more about your experience with our cupcakes. Please leave any additional comments below:
                    <textarea id="textarea" wrap="soft" rows="5" cols="50" placeholder="Enter your comments here..."></textarea>
                </label>
                <button id="submit" type="submit">Submit</button>
            </fieldset>
        </form>
    </section>
</body>
</html>
